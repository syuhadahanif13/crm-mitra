<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>CRM & Pembiayaan Emas - Raja Emas Indonesia</title>
    <meta name="description" content="Sistem CRM Nasabah, Akad Cicilan Emas, WhatsApp Automation Jatuh Tempo, dan Stock Opname Brankas" />
    <link rel="icon" type="image/png" href="https://images.glints.com/unsafe/glints-dashboard.oss-ap-southeast-1.aliyuncs.com/company-logo/1871f1632174b485181d942f9d5e61b6.png" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('crm_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased select-none dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
